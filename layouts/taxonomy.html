{{ define "main" }}
  <p class="page-kicker">{{ i18n "data" }}</p>
  <h1 class="heading">{{ .Title }}</h1>
  <div class="goal-list">
    {{ range .Pages }}
      <a class="goal-card" href="{{ .RelPermalink }}">
        <span class="tick" aria-hidden="true"></span>
        <div>
          <h2>{{ .LinkTitle }}</h2>
          <p>{{ len .Pages }} records</p>
        </div>
      </a>
    {{ end }}
  </div>
{{ end }}
