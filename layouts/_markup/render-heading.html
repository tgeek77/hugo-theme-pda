<h{{ .Level }} id="{{ .Anchor | safeURL }}" {{- with .Attributes.class }} class="{{ . }}"{{ end }}>
  {{ .Text | safeHTML }}
  {{- if and (ge .Level 2) (le .Level 4) }}
    <a class="anchor" href="#{{ .Anchor | safeURL }}" aria-label="{{ printf "Link to %s" .PlainText }}">#</a>
  {{- end }}
</h{{ .Level }}>
