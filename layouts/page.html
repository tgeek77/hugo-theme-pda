{{ define "main" }}
  <article class="prose">
    <p class="page-kicker">{{ i18n "notes" }}</p>
    <h1 class="heading">{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
      <p class="meta">
        <time datetime="{{ .Date | time.Format `2006-01-02T15:04:05Z07:00` }}">{{ .Date | time.Format ":date_long" }}</time>
      </p>
    {{ end }}
    {{ .Content }}
    {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
  </article>
{{ end }}
